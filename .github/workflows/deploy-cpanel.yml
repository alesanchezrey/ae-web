name: Deploy a cPanel

# Compila la SPA estática y sube el contenido de dist/ a cPanel por FTP.
# Secrets necesarios en GitHub (Settings > Secrets and variables > Actions):
#   FTP_SERVER    -> ej. ftp.alimentosesperanza.com
#   FTP_USERNAME  -> usuario FTP de cPanel
#   FTP_PASSWORD  -> contraseña de ese usuario
# Variable opcional (Settings > Variables):
#   FTP_DIR       -> carpeta destino, por defecto public_html/

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar SPA estática
        run: npm run build:static

      - name: Subir dist/ a cPanel por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/cgi-bin/**
