---
# Despliegue con "Git Version Control" de cPanel.
# Requiere que la carpeta dist/ exista en el repo (compilada antes del push).
# Recomendado: usar el workflow de GitHub Actions (.github/workflows/deploy-cpanel.yml),
# que compila y sube dist/ automáticamente por FTP.
deployment:
  tasks:
    - export DEPLOYPATH=/home/alimepkt/public_html
    - if [ -d dist ]; then /bin/cp -R dist/. $DEPLOYPATH/; fi
    - if [ -f dist/.htaccess ]; then /bin/cp -f dist/.htaccess $DEPLOYPATH/.htaccess; fi
